name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  app:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Service-role key must never reach the browser bundle
        run: |
          if grep -rIl "SUPABASE_SERVICE_ROLE_KEY\|service_role" .next/static; then
            echo "::error::Server-only secret name found in client bundle"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: |
            .next
            !.next/cache
          include-hidden-files: true
          retention-days: 1

  db:
    name: Migrations + RLS tests (Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Start Supabase (applies migrations + seed)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,mailpit,supavisor
      - name: SQL / RLS tests
        run: bash scripts/test-db.sh
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: Reset is repeatable (migrations + seed apply cleanly twice)
        run: supabase db reset
      - name: Generated types match lib/db/types.ts
        # Informational until the hand-written Phase 0 file is replaced by real output.
        continue-on-error: true
        run: |
          supabase gen types typescript --local --schema public > /tmp/types.ts
          pnpm exec prettier --stdin-filepath lib/db/types.ts < /tmp/types.ts > /tmp/types.fmt.ts
          diff -u lib/db/types.ts /tmp/types.fmt.ts || echo "::warning::lib/db/types.ts differs from generated types"
      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup

  e2e:
    name: E2E + accessibility (Playwright)
    runs-on: ubuntu-latest
    needs: app
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
